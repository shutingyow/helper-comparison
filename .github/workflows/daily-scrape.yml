name: Daily HelperPlace Scrape

on:
  schedule:
    # 00:00 UTC = 08:00 SGT
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Verify ingest API and list scrape targets
        id: targets
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          ORIGIN=$(node -e "console.log(new URL(process.env.INGEST_URL).origin)")
          URL="${ORIGIN}/api/scraper/targets"
          echo "Checking ${URL}"
          STATUS=$(curl -sS -o /tmp/scrape-targets.json -w "%{http_code}" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            "${URL}")
          echo "targets HTTP ${STATUS}"
          cat /tmp/scrape-targets.json
          echo ""
          if [ "$STATUS" != "200" ]; then
            echo "Ingest preflight failed — check INGEST_URL and INGEST_SECRET"
            exit 1
          fi
          if ! grep -q '"targets"' /tmp/scrape-targets.json; then
            echo "Targets API returned unexpected JSON — redeploy Vercel and verify /api/scraper/targets exists"
            exit 1
          fi
          COUNT=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/scrape-targets.json','utf8')); console.log((j.targets||[]).length)")
          echo "target_count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "No users with scrape enabled — nothing to do."
          fi

      - name: Run scraper for each user
        if: steps.targets.outputs.target_count != '0'
        working-directory: scraper
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          ORIGIN=$(node -e "console.log(new URL(process.env.INGEST_URL).origin)")
          USER_IDS=$(node -e "
            const j = JSON.parse(require('fs').readFileSync('/tmp/scrape-targets.json', 'utf8'));
            for (const t of j.targets || []) console.log(t.userId);
          ")
          if [ -z "$USER_IDS" ]; then
            echo "No scrape targets found."
            exit 0
          fi
          FAILED=0
          for USER_ID in $USER_IDS; do
            echo "=== Scraping for user ${USER_ID} ==="
            if ! SCRAPE_USER_ID="$USER_ID" npm run scrape; then
              echo "Scrape failed for user ${USER_ID}"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload scrape artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scraper/output/
          if-no-files-found: ignore
