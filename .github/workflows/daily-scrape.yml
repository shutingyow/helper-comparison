name: Daily HelperPlace Scrape

on:
  schedule:
    # 00:00 UTC = 08:00 SGT
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Verify ingest API
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          ORIGIN=$(node -e "console.log(new URL(process.env.INGEST_URL).origin)")
          URL="${ORIGIN}/api/ingest/known-ids"
          echo "Checking ${URL}"
          STATUS=$(curl -sS -o /tmp/ingest-check.json -w "%{http_code}" \
            -H "x-ingest-secret: ${INGEST_SECRET}" \
            "${URL}")
          echo "known-ids HTTP ${STATUS}"
          head -c 300 /tmp/ingest-check.json
          echo ""
          if [ "$STATUS" != "200" ]; then
            echo "Ingest preflight failed — check INGEST_URL origin and INGEST_SECRET on GitHub + Vercel"
            exit 1
          fi
          if ! grep -q '"helperPlaceIds"' /tmp/ingest-check.json; then
            echo "Ingest preflight returned non-JSON — redeploy Vercel and verify /api/ingest/known-ids exists"
            exit 1
          fi

      - name: Run scraper
        working-directory: scraper
        env:
          HELPERPLACE_EMAIL: ${{ secrets.HELPERPLACE_EMAIL }}
          HELPERPLACE_PASSWORD: ${{ secrets.HELPERPLACE_PASSWORD }}
          HELPERPLACE_APPLICANTS_URL: ${{ secrets.HELPERPLACE_APPLICANTS_URL }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: npm run scrape

      - name: Upload scrape artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scraper/output/
          if-no-files-found: ignore
