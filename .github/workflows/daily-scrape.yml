name: Daily HelperPlace Scrape

on:
  schedule:
    # 00:00 UTC = 08:00 SGT
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        env:
          HELPERPLACE_EMAIL: ${{ secrets.HELPERPLACE_EMAIL }}
          HELPERPLACE_PASSWORD: ${{ secrets.HELPERPLACE_PASSWORD }}
          HELPERPLACE_APPLICANTS_URL: ${{ secrets.HELPERPLACE_APPLICANTS_URL }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: npm run scrape

      - name: Upload scrape artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scraper/output/
          if-no-files-found: ignore
